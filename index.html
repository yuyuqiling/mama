<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>母亲节快乐</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e0,#fff0f5);
    overflow:hidden;
    font-family:"Microsoft YaHei",sans-serif;
}

.card-container{
    perspective:1200px;
}

.card{
    width:320px;
    height:450px;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 1s;
    cursor:pointer;
}

.card.open{
    transform:rotateY(-180deg);
}

.front,
.inside{
    position:absolute;
    width:100%;
    height:100%;
    backface-visibility:hidden;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.front{
    background:linear-gradient(135deg,#ff8fab,#ffb3c6);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
}

.front h1{
    font-size:42px;
    margin-bottom:20px;
}

.polaroid{
    position:relative;
    background:white;
    padding:15px 15px 55px;
    border-radius:6px;
    box-shadow:0 12px 30px rgba(0,0,0,0.2);
    transform:rotate(-5deg);
    transition:0.4s;
    margin-bottom:30px;
}

.polaroid:hover{
    transform:rotate(0deg) scale(1.05);
}

.cover-photo{
    width:190px;
    height:220px;
    object-fit:cover;
    display:block;
}

.polaroid-text{
    position:absolute;
    width:100%;
    left:0;
    bottom:18px;
    text-align:center;
    font-size:20px;
    color:#666;
    font-family:cursive;
}

.inside{
    background:white;
    transform:rotateY(180deg);
    padding:40px 30px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.inside h2{
    color:#ff4d6d;
    margin-bottom:20px;
    font-size:32px;
}

.inside p{
    font-size:20px;
    color:#555;
    line-height:1.8;
}

.heart{
    position:absolute;
    color:#ff4d6d;
    font-size:20px;
    animation:float 5s linear infinite;
}

@keyframes float{
    0%{
        transform:translateY(100vh) scale(0.5);
        opacity:0;
    }
    10%{
        opacity:1;
    }
    100%{
        transform:translateY(-120vh) scale(1.2);
        opacity:0;
    }
}

.slider-page{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.slider{
    width:220px;
    height:280px;
    position:relative;
    overflow:hidden;
    border-radius:20px;
    margin-bottom:25px;
}

.slide{
    position:absolute;
    top:0;
    left:0;

    width:100%;
    height:100%;

    object-fit:cover;

    opacity:0;

    transition:opacity 0.8s ease;

    border-radius:20px;

    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}


.slide.active{
    opacity:1;
}

#nextBtn{
    position:absolute;
    bottom:25px;
    left:25px;
    padding:10px 18px;
    border:none;
    border-radius:30px;
    background:#ff8fab;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

#nextBtn:hover{
    transform:scale(1.05);
}

.message-page{
    display:none;
    animation:fadeIn 1s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}



</style>
</head>

<body>

<div class="card-container">
    <div class="card" id="card">

        <div class="front">

            <div class="polaroid">

                <img src="mom.jpg" class="cover-photo">

                <div class="polaroid-text">
                    沈利云女士 ❤️
                </div>

        </div>

        <h2>妈妈我爱你</h2>
        <p>点击打开贺卡</p>

    </div>

        <div class="inside">

    <!-- 轮播页面 -->
    <div class="slider-page" id="sliderPage">

        <div class="slider">

            <img src="1.jpg" class="slide active">
            <img src="2.jpg" class="slide">
            <img src="3.jpg" class="slide">
            <img src="4.jpg" class="slide">
    

        </div>

        <button id="nextBtn">
            下一步 →
        </button>

    </div>

    <!-- 文字页面 -->
    <div class="message-page" id="messagePage">

        <h2>妈妈 ❤️</h2>

        <p>
            感谢您一直以来的陪伴与照顾。<br><br>

            愿岁月温柔待您，<br>
            愿您永远健康快乐。<br><br>

            母亲节快乐！
        </p>

    </div>

</div>

    </div>
</div>

<script>
    const card = document.getElementById("card");

    card.addEventListener("click", () => {

        if(!card.classList.contains("open")){
            card.classList.add("open");
        }

    });


    // 爱心动画
    function createHeart(){

        const heart = document.createElement("div");

        heart.classList.add("heart");

        heart.innerHTML = "❤";

        heart.style.left = Math.random() * 100 + "vw";

        heart.style.fontSize = Math.random() * 20 + 15 + "px";

        heart.style.animationDuration = Math.random() * 3 + 3 + "s";

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },5000);

    }

    setInterval(createHeart,300);


    // 图片轮播
    const slides = document.querySelectorAll(".slide");

    let current = 0;

    setInterval(()=>{

        slides[current].classList.remove("active");

        current = (current + 1) % slides.length;

        slides[current].classList.add("active");

    },2000);


    // 下一步按钮
    const nextBtn = document.getElementById("nextBtn");

    const sliderPage = document.getElementById("sliderPage");

    const messagePage = document.getElementById("messagePage");

    nextBtn.addEventListener("click",()=>{

        sliderPage.style.display = "none";

        messagePage.style.display = "flex";

        messagePage.style.flexDirection = "column";

        messagePage.style.justifyContent = "center";

        messagePage.style.alignItems = "center";

    });
</script>

</body>
</html>
